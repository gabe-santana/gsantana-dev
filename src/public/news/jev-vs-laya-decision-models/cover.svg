<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Jev vs. Laya</title>
  <desc id="desc">Editorial comparison of a hosted decision API and a self-hosted model, illustrated with branching paths.</desc>
  <rect width="1200" height="630" fill="#111816"/>
  <path d="M0 110H1200M0 510H1200M80 0V630M1120 0V630" stroke="#30433b" stroke-width="1"/>
  <text x="80" y="75" fill="#b3c5bc" font-family="Consolas,monospace" font-size="22">gsantana.dev / AI</text>
  <text x="1120" y="75" text-anchor="end" fill="#b3c5bc" font-family="Consolas,monospace" font-size="22">2026.09</text>
  <text x="80" y="288" fill="#88edb6" font-family="Segoe UI,sans-serif" font-weight="700" font-size="130">Jev</text>
  <text x="532" y="275" fill="#b3c5bc" font-family="Consolas,monospace" font-size="44">vs.</text>
  <text x="710" y="288" fill="#ffad91" font-family="Segoe UI,sans-serif" font-weight="700" font-size="130">Laya</text>
  <text x="86" y="348" fill="#b3c5bc" font-family="Consolas,monospace" font-size="24">API</text>
  <text x="718" y="348" fill="#b3c5bc" font-family="Consolas,monospace" font-size="24">SELF-HOSTED</text>
  <path d="M96 416H340L388 382H490M340 416L388 450H490" fill="none" stroke="#88edb6" stroke-width="5"/>
  <path d="M728 416H946L994 382H1100M946 416L994 450H1100" fill="none" stroke="#ffad91" stroke-width="5"/>
  <rect x="476" y="370" width="24" height="24" fill="#88edb6"/>
  <rect x="476" y="438" width="24" height="24" fill="#111816" stroke="#88edb6" stroke-width="3"/>
  <rect x="1088" y="370" width="24" height="24" fill="#ffad91"/>
  <rect x="1088" y="438" width="24" height="24" fill="#111816" stroke="#ffad91" stroke-width="3"/>
  <text x="80" y="574" fill="#eef5f0" font-family="Consolas,monospace" font-size="26">choice / score / noul</text>
  <text x="1120" y="574" text-anchor="end" fill="#b3c5bc" font-family="Consolas,monospace" font-size="22">INPUT &gt; DECISION</text>
</svg>